name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      GOENV: ${{ github.workspace }}/go.env
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.47.2"
          setup_only: true
      - name: proto dirty check
        run: |
          ./scripts/generate-proto.sh
          git diff --exit-code gen/ proto/buf.lock crates/flavor-proto/flavor.binpb
      - name: test
        run: |
          ./scripts/go.sh vet ./...
          ./scripts/go.sh test ./...

  rust:
    runs-on: ubuntu-24.04
    env:
      GOENV: ${{ github.workspace }}/go.env
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: frontend dist placeholder
        run: mkdir -p desktop/dist
      - name: test
        run: cargo test --workspace

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: no daemon rpc client in the webview
        run: |
          ! grep -rnE "@connectrpc|connect-web|createClient|flavord\.sock" src
      - run: npm run build
      - run: npm test
