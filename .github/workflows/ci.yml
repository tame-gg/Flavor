name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
      - name: proto dirty check
        run: |
          ./scripts/generate-proto.sh
          git diff --exit-code gen/ proto/buf.lock
      - name: test
        run: go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: check
        run: cargo check --workspace
