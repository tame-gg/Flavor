name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      GOENV: ${{ github.workspace }}/go.env
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3
        with:
          version: "1.47.2"
          setup_only: true
      - name: proto dirty check
        run: |
          ./scripts/generate-proto.sh
          git diff --exit-code gen/ proto/buf.lock crates/flavor-proto/flavor.binpb
      - name: test
        run: |
          ./scripts/go.sh vet ./...
          ./scripts/go.sh test ./...

  go-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      GOENV: ${{ github.workspace }}/go.env
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: test
        run: |
          ./scripts/go.sh vet ./...
          ./scripts/go.sh test ./...
      - name: launchd plist
        run: plutil -lint packaging/launchd/*.plist

  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      GOENV: ${{ github.workspace }}/go.env
      TMPDIR: ${{ matrix.runner == 'macos-15' && '/tmp' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: frontend dist placeholder
        run: mkdir -p desktop/dist
      - name: test
        run: cargo test --workspace

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: no daemon rpc client in the webview
        run: |
          ! grep -rnE "@connectrpc|connect-web|createClient|flavord\.sock" src
      - run: npm run build
      - run: npm test
