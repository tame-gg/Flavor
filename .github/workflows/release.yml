name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing, e.g. 0.1.0-beta.6
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $v"; exit 1; }
          grep -q "^version = \"$v\"$" Cargo.toml || { echo "Cargo.toml is not $v"; exit 1; }
          for f in desktop/package.json desktop/src-tauri/tauri.conf.json; do
            jq -e --arg v "$v" '.version == $v' "$f" >/dev/null || { echo "$f is not $v"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"

  selinux:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: dnf install -y selinux-policy-devel make
      - run: make -C packaging/selinux -f /usr/share/selinux/devel/Makefile flavor_netd.pp
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: selinux
          path: packaging/selinux/flavor_netd.pp

  build:
    needs: [version, selinux]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOENV: ${{ github.workspace }}/go.env
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - run: cargo install cargo-auditable --locked --version 0.7.7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: selinux
          path: selinux
      - name: build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: SELINUX_PP=selinux/flavor_netd.pp ./scripts/release.sh "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-macos:
    needs: [version]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      GOENV: ${{ github.workspace }}/go.env
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - run: cargo install cargo-auditable --locked --version 0.7.7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/release-macos.sh "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tarball-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-windows:
    needs: [version]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GOENV: ${{ github.workspace }}/go.env
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - run: cargo install cargo-auditable --locked --version 0.7.7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/release-windows.sh "$VERSION" "$ARCH"
      - name: installer smoke test
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/smoke-windows-installer.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tarball-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*-setup.exe

  publish:
    needs: [version, build, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: sboms
        run: |
          syft scan dir:. --exclude './dist/**' --source-name flavor --source-version "$VERSION" -o "spdx-json=dist/flavor-$VERSION-source.spdx.json"
          for t in dist/*.tar.gz; do
            d="$(mktemp -d)"
            tar -xzf "$t" -C "$d"
            syft scan "dir:$d" --source-name "$(basename "$t" .tar.gz)" --source-version "$VERSION" -o "spdx-json=${t%.tar.gz}.spdx.json"
          done
          for z in dist/*.zip; do
            d="$(mktemp -d)"
            unzip -q "$z" -d "$d"
            syft scan "dir:$d" --source-name "$(basename "$z" .zip)" --source-version "$VERSION" -o "spdx-json=${z%.zip}.spdx.json"
          done
      - name: checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip *-setup.exe *.spdx.json > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - if: startsWith(github.ref, 'refs/tags/v')
        name: sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
            --title "Flavor $VERSION" --notes "Draft. Add SHA256SUMS.asc before publishing." \
            dist/*.tar.gz dist/*.zip dist/*-setup.exe dist/*.spdx.json dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
