version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: git.lunarlabs.dev/flavor/flavor/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: ../gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    out: ../gen/ts
    opt:
      - target=ts
