syntax = "proto3";

package flavor.netd.v1;

message Request {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  uint64 request_id = 3;
  oneof body {
    HelloRequest hello = 10;
    CreateSyntheticInterfaceRequest create_synthetic_interface = 11;
    DestroySyntheticInterfaceRequest destroy_synthetic_interface = 12;
    ConfigureDnsRequest configure_dns = 13;
    ClearDnsRequest clear_dns = 14;
    StatusRequest status = 15;
  }
}

message Response {
  uint64 request_id = 1;
  Error error = 2;
  oneof body {
    HelloResponse hello = 10;
    CreateSyntheticInterfaceResponse create_synthetic_interface = 11;
    DestroySyntheticInterfaceResponse destroy_synthetic_interface = 12;
    ConfigureDnsResponse configure_dns = 13;
    ClearDnsResponse clear_dns = 14;
    StatusResponse status = 15;
  }
}

message Error {
  ErrorCode code = 1;
  string detail = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_PROTOCOL_INCOMPATIBLE = 2;
  ERROR_CODE_PROTOCOL_ERROR = 3;
  ERROR_CODE_RATE_LIMITED = 4;
  ERROR_CODE_HOST_INSTANCE_IN_USE = 5;
  ERROR_CODE_INSTANCE_NOT_FOUND = 6;
  ERROR_CODE_INVALID_V6_PREFIX = 7;
  ERROR_CODE_INVALID_V4_PREFIX = 8;
  ERROR_CODE_INVALID_MTU = 9;
  ERROR_CODE_RANGE_OVERLAP = 10;
  ERROR_CODE_INVALID_DOMAIN = 11;
  ERROR_CODE_DNS_CAPTURE_NOT_ALLOWED = 12;
  ERROR_CODE_RESOLVED_UNAVAILABLE = 13;
  ERROR_CODE_TUN_UNAVAILABLE = 14;
  ERROR_CODE_NETLINK_FAILED = 15;
  ERROR_CODE_FD_TRANSFER_FAILED = 16;
  ERROR_CODE_INTERNAL = 17;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_IPV6 = 1;
  CAPABILITY_IPV4 = 2;
  CAPABILITY_RESOLVED_DNS = 3;
}

message IpPrefix {
  bytes address = 1;
  uint32 bits = 2;
}

message HelloRequest {}

message HelloResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  repeated Capability capabilities = 3;
  bool occupied_by_other_user = 4;
  bool caller_owns_instance = 5;
}

message CreateSyntheticInterfaceRequest {
  IpPrefix v6_install_prefix = 1;
  IpPrefix v4_pool = 2;
  uint32 mtu = 3;
}

message CreateSyntheticInterfaceResponse {
  string interface_name = 1;
  uint32 interface_index = 2;
  bytes v6_host_address = 3;
  bytes v6_resolver_address = 4;
  bytes v4_host_address = 5;
  bytes v4_resolver_address = 6;
}

message DestroySyntheticInterfaceRequest {}

message DestroySyntheticInterfaceResponse {}

message ConfigureDnsRequest {
  repeated string routing_domains = 1;
}

message ConfigureDnsResponse {
  repeated string routing_domains = 1;
}

message ClearDnsRequest {}

message ClearDnsResponse {}

message StatusRequest {}

message StatusResponse {
  bool occupied_by_other_user = 1;
  Instance instance = 2;
}

message Instance {
  string interface_name = 1;
  uint32 interface_index = 2;
  IpPrefix v6_install_prefix = 3;
  IpPrefix v4_pool = 4;
  uint32 mtu = 5;
  bool dns_configured = 6;
  repeated string routing_domains = 7;
}
