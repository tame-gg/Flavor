syntax = "proto3";

package flavor.v1;

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_TAILSCALE = 1;
  PROVIDER_TYPE_HEADSCALE = 2;
}

enum NetworkConnectionState {
  NETWORK_CONNECTION_STATE_UNSPECIFIED = 0;
  NETWORK_CONNECTION_STATE_DISABLED = 1;
  NETWORK_CONNECTION_STATE_DISCONNECTED = 2;
  NETWORK_CONNECTION_STATE_CONNECTING = 3;
  NETWORK_CONNECTION_STATE_AUTHENTICATING = 4;
  NETWORK_CONNECTION_STATE_AWAITING_APPROVAL = 5;
  NETWORK_CONNECTION_STATE_CONNECTED = 6;
  NETWORK_CONNECTION_STATE_DEGRADED = 7;
  NETWORK_CONNECTION_STATE_RECONNECTING = 8;
  NETWORK_CONNECTION_STATE_REMOVING = 9;
  NETWORK_CONNECTION_STATE_ERROR = 10;
}

enum FlavorErrorCode {
  FLAVOR_ERROR_CODE_UNSPECIFIED = 0;
  FLAVOR_ERROR_CODE_NETWORK_NOT_FOUND = 1;
  FLAVOR_ERROR_CODE_INVALID_CONTROL_URL = 2;
  FLAVOR_ERROR_CODE_CONTROL_SERVER_UNREACHABLE = 3;
  FLAVOR_ERROR_CODE_AUTHENTICATION_REQUIRED = 4;
  FLAVOR_ERROR_CODE_AUTHENTICATION_FAILED = 5;
  FLAVOR_ERROR_CODE_APPROVAL_REQUIRED = 6;
  FLAVOR_ERROR_CODE_NETWORK_ALREADY_CONNECTED = 7;
  FLAVOR_ERROR_CODE_NETWORK_BUSY = 8;
  FLAVOR_ERROR_CODE_SECRET_STORE_UNAVAILABLE = 9;
  FLAVOR_ERROR_CODE_DAEMON_PERMISSION_DENIED = 10;
  FLAVOR_ERROR_CODE_STATE_DIRECTORY_ERROR = 11;
  FLAVOR_ERROR_CODE_RESYNC_REQUIRED = 12;
  FLAVOR_ERROR_CODE_DAEMON_SHUTTING_DOWN = 13;
  FLAVOR_ERROR_CODE_INVALID_ARGUMENT = 14;
  FLAVOR_ERROR_CODE_INTERNAL = 15;
  FLAVOR_ERROR_CODE_WORKSPACE_NOT_FOUND = 16;
  FLAVOR_ERROR_CODE_DEVICE_NOT_FOUND = 17;
  FLAVOR_ERROR_CODE_DESTINATION_AMBIGUOUS = 18;
  FLAVOR_ERROR_CODE_DESTINATION_NOT_FOUND = 19;
  FLAVOR_ERROR_CODE_DESTINATION_UNREACHABLE = 20;
  FLAVOR_ERROR_CODE_NOT_AN_EXIT_NODE = 21;
}

message FlavorErrorDetail {
  FlavorErrorCode code = 1;
  string safe_message = 2;
  bool retryable = 3;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_HEADSCALE = 1;
  CAPABILITY_DEVICE_SNAPSHOTS = 2;
  CAPABILITY_CONNECTION_INSPECTOR = 3;
  CAPABILITY_CONFLICT_CENTER = 4;
  CAPABILITY_WORKSPACES = 5;
  CAPABILITY_DESTINATION_PREFERENCES = 6;
  CAPABILITY_FORWARDING = 7;
  CAPABILITY_SOCKS_PROXY = 8;
  CAPABILITY_EXIT_NODES = 9;
  CAPABILITY_ROUTES = 10;
}
