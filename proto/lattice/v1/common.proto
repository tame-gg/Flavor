syntax = "proto3";

package lattice.v1;

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_TAILSCALE = 1;
  PROVIDER_TYPE_HEADSCALE = 2;
}

enum NetworkConnectionState {
  NETWORK_CONNECTION_STATE_UNSPECIFIED = 0;
  NETWORK_CONNECTION_STATE_DISABLED = 1;
  NETWORK_CONNECTION_STATE_DISCONNECTED = 2;
  NETWORK_CONNECTION_STATE_CONNECTING = 3;
  NETWORK_CONNECTION_STATE_AUTHENTICATING = 4;
  NETWORK_CONNECTION_STATE_AWAITING_APPROVAL = 5;
  NETWORK_CONNECTION_STATE_CONNECTED = 6;
  NETWORK_CONNECTION_STATE_DEGRADED = 7;
  NETWORK_CONNECTION_STATE_RECONNECTING = 8;
  NETWORK_CONNECTION_STATE_REMOVING = 9;
  NETWORK_CONNECTION_STATE_ERROR = 10;
}

enum LatticeErrorCode {
  LATTICE_ERROR_CODE_UNSPECIFIED = 0;
  LATTICE_ERROR_CODE_NETWORK_NOT_FOUND = 1;
  LATTICE_ERROR_CODE_INVALID_CONTROL_URL = 2;
  LATTICE_ERROR_CODE_CONTROL_SERVER_UNREACHABLE = 3;
  LATTICE_ERROR_CODE_AUTHENTICATION_REQUIRED = 4;
  LATTICE_ERROR_CODE_AUTHENTICATION_FAILED = 5;
  LATTICE_ERROR_CODE_APPROVAL_REQUIRED = 6;
  LATTICE_ERROR_CODE_NETWORK_ALREADY_CONNECTED = 7;
  LATTICE_ERROR_CODE_NETWORK_BUSY = 8;
  LATTICE_ERROR_CODE_SECRET_STORE_UNAVAILABLE = 9;
  LATTICE_ERROR_CODE_DAEMON_PERMISSION_DENIED = 10;
  LATTICE_ERROR_CODE_STATE_DIRECTORY_ERROR = 11;
  LATTICE_ERROR_CODE_RESYNC_REQUIRED = 12;
  LATTICE_ERROR_CODE_DAEMON_SHUTTING_DOWN = 13;
  LATTICE_ERROR_CODE_INVALID_ARGUMENT = 14;
  LATTICE_ERROR_CODE_INTERNAL = 15;
}

message LatticeErrorDetail {
  LatticeErrorCode code = 1;
  string safe_message = 2;
  bool retryable = 3;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_HEADSCALE = 1;
  CAPABILITY_DEVICE_SNAPSHOTS = 2;
  CAPABILITY_CONNECTION_INSPECTOR = 3;
  CAPABILITY_CONFLICT_CENTER = 4;
}
